[project]
name = "kurigram-mcp"
version = "0.3.2"
description = "MCP server for debugging Telegram bots via a user session (kurigram/pyrogram MTProto)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE*"]
keywords = ["mcp", "telegram", "mtproto", "bot", "debug", "kurigram", "pyrogram", "ai"]
authors = [
    { name = "z-mio", email = "zilingmio@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "kurigram>=2.2.25",
    "loguru>=0.7.3",
    "mcp>=2.0.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tgcrypto>=1.2.5",
]

[project.scripts]
kurigram-mcp = "kurigram_mcp.cli:main"
km = "kurigram_mcp.cli:main"

[project.urls]
Documentation = "https://github.com/z-mio/kurigram-mcp"
Source = "https://github.com/z-mio/kurigram-mcp"
Issues = "https://github.com/z-mio/kurigram-mcp/issues"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle 错误检查
    "W", # pycodestyle 警告检查
    "F", # pyflakes 错误检查
    "I", # isort 导入排序
    "B", # flake8-bugbear 常见错误检查
    "C4", # flake8-comprehensions 列表/字典推导式检查
    "UP", # pyupgrade 自动升级语法
]
ignore = [
    "B008", # 不在参数默认值中执行函数调用
    "C901", # 函数复杂度过高
]

[tool.mypy]
python_version = "3.12"
files = ["./"]
exclude = ["tests", "scripts"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
