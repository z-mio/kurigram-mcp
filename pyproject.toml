[project]
name = "kurigram-mcp"
version = "0.1.0"
description = "MCP server for debugging Telegram bots via a user session (kurigram/pyrogram MTProto)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE*"]
keywords = ["mcp", "telegram", "mtproto", "bot", "debug", "kurigram", "pyrogram", "ai"]
authors = [
    { name = "z-mio", email = "zilingmio@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "kurigram>=2.2.24",
    "loguru>=0.7.3",
    "mcp>=2.0.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tgcrypto>=1.2.5",
]

[project.scripts]
kurigram-mcp = "kurigram_mcp.cli:main"
km = "kurigram_mcp.cli:main"

[project.urls]
Documentation = "https://github.com/z-mio/kurigram-mcp"
Source = "https://github.com/z-mio/kurigram-mcp"
Issues = "https://github.com/z-mio/kurigram-mcp/issues"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
